buildscript {
    ext.kotlinVersion = '2.1.20'
    ext.protobufGradlePluginVersion = '0.9.5'
    ext.androidToolsBuildGradleVersion = '8.7.3'

    project.ext.lwjglVersion = "3.3.4"
    project.ext.lwjglNatives = "natives-macos-arm64"

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$androidToolsBuildGradleVersion"
        classpath "com.google.protobuf:protobuf-gradle-plugin:$protobufGradlePluginVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.20-1.0.32'
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'

    // Set consistent JVM target for all modules
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    ext {
        appName = "bathroom-attendant"
        gdxVersion = "1.13.1"
        gdxControllersVersion = '2.2.4'
        kotlinCrVersion = '1.10.1'
        guavaVersion = '33.4.0-jre'
        guavaAndroidVersion = '33.4.0-android'
        slf4jVersion = '2.0.16'
        slf4jAndroidVersion = '2.0.16'
        protobufVersion = '4.29.3'
        protocVersion = '4.29.3'
        koin_ksp_version = '1.4.0'
        koin_version = '4.0.2'
    }

    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}

project(":desktop") {
    apply plugin: "kotlin"
    apply plugin: "com.google.devtools.ksp"

    dependencies {
        implementation project(":core")

        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
        implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        implementation "com.google.guava:guava:$guavaVersion"
        implementation "com.diogonunes:JColor:5.5.1"
        implementation 'ch.qos.logback:logback-classic:1.5.16'
        implementation "io.insert-koin:koin-core:$koin_version"
        implementation "io.insert-koin:koin-annotations:$koin_ksp_version"

        implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

        api 'io.github.oshai:kotlin-logging-jvm:7.0.3'

        ksp "io.insert-koin:koin-ksp-compiler:$koin_ksp_version"
    }
}

project(":android") {
    apply plugin: "android"
    apply plugin: "kotlin-android"
    apply plugin: "com.google.protobuf"

    configurations { natives }

    dependencies {
        implementation project(":core")

        api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
        api "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
        api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinCrVersion"

        api "com.google.guava:guava:$guavaAndroidVersion"

        coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    }
}

project(":core") {
    apply plugin: "kotlin"
    apply plugin: "com.google.protobuf"
    apply plugin: "com.google.devtools.ksp"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        api 'io.github.oshai:kotlin-logging-jvm:7.0.3'

        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinCrVersion"
        implementation "com.google.protobuf:protobuf-javalite:$protobufVersion"
        implementation "com.google.protobuf:protobuf-kotlin-lite:$protobufVersion"
        implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
        implementation "io.insert-koin:koin-core:$koin_version"
        implementation "io.insert-koin:koin-annotations:$koin_ksp_version"
        ksp "io.insert-koin:koin-ksp-compiler:$koin_ksp_version"
    }
}

tasks.eclipse.doLast {
    delete ".project"
}
