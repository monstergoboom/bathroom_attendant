apply plugin: "kotlin"
apply plugin: "com.google.protobuf"

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    main {
        java.srcDirs = ["src/", "${buildDir}/generated/sources/proto/main/java"]
        kotlin.srcDirs += "${buildDir}/generated/sources/proto/main/kotlin"
        proto.srcDirs = ["src/protos"]
    }
}

// Ensure protobuf generation runs before compilation and KSP
tasks.named("compileKotlin") {
    dependsOn("generateProto")
}

tasks.named("compileJava") {
    dependsOn("generateProto")
}

afterEvaluate {
    tasks.findByName("kspKotlin")?.dependsOn("generateProto")
}

eclipse.project {
    name = appName + "-core"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.29.3"
    }

    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
                kotlin {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}
